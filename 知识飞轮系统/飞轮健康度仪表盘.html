<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识飞轮健康度仪表盘</title>
<style>
:root{
  --bg:#0f1424; --panel:#171d32; --line:#2a3354; --accent:#4f9dff;
  --sub:#9fb0d8; --green:#3fd07f; --amber:#ffb547; --red:#ff6b6b;
}
*{box-sizing:border-box}
body{background:var(--bg);color:#e6ecff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;padding:28px;line-height:1.5}
h1{font-size:22px;margin:0 0 4px}
.meta{color:var(--sub);font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi .num{font-size:30px;font-weight:700;color:var(--accent)}
.kpi .lbl{color:var(--sub);font-size:13px;margin-top:4px}
.kpi.green .num{color:var(--green)} .kpi.amber .num{color:var(--amber)} .kpi.red .num{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:22px}
.card h2{font-size:16px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--sub);font-weight:600}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:#243056;color:#cfe0ff}
</style>
</head>
<body>
<h1>知识飞轮健康度仪表盘</h1>
<div class="meta" id="updated"></div>

<div class="grid" id="kpis"></div>

<div class="card">
  <h2>经验卡片增长曲线</h2>
  <svg id="chart" viewBox="0 0 680 240" width="100%" height="240"></svg>
</div>

<div class="card">
  <h2>关键指标</h2>
  <table id="metrics"><tbody></tbody></table>
</div>

<script>
const DATA = {
  updated: "2026-08-13",
  kpi: { experienceCards:26, ruleFiles:323, caseNotes:17, ongoingCases:0 },
  cardGrowth: [
    {date:"2026-07-13", cum:2},
    {date:"2026-07-14", cum:5},
    {date:"2026-07-18", cum:6},
    {date:"2026-07-19", cum:6},
    {date:"2026-07-26", cum:20},
    {date:"2026-07-27", cum:20},
    {date:"2026-07-31", cum:24},
    {date:"2026-08-03", cum:26},
    {date:"2026-08-12", cum:26},
    {date:"2026-08-13", cum:26},
  ],
  metrics: [
    {name:"协同效果命中率", value:"待采集", desc:"分身问答埋点日志积累中，每月28日协同效果月报将出首值"},
    {name:"经验卡片（真实/演练）", value:"25/26", desc:"凤仪村为预测型无裁判结果；罗江辉为演练卡"},
    {name:"裁判规则库成熟度", value:"🌿幼苗", desc:"主库 R001-R015 + 人伤子库 R016-R023，共 23 条；元数据已对齐"},
    {name:"案件-卡片-规则三维索引", value:"已建", desc:"2026-07-18 连接层加厚（P2），覆盖 18 案件/6 卡片/23 规则"}
  ]
};

document.getElementById("updated").textContent = "数据更新：" + DATA.updated + " ｜ 单一知识源：LawKB/知识飞轮系统 ｜ 每周一 07:00 自动刷新";

const kpis = [
  {n:DATA.kpi.experienceCards, l:"经验卡片（真实/演练/预测）", c:""},
  {n:DATA.kpi.ruleFiles, l:"裁判规则库文件", c:"green"},
  {n:DATA.kpi.caseNotes, l:"CaseDrop 已归档案件", c:"amber"},
  {n:DATA.kpi.ongoingCases, l:"在办案件（待预判推送）", c:"red"}
];
document.getElementById("kpis").innerHTML = kpis.map(k=>
  `<div class="kpi ${k.c}"><div class="num">${k.n}</div><div class="lbl">${k.l}</div></div>`).join("");

const svg = document.getElementById("chart");
const W=680,H=240,pad=40;
const pts = DATA.cardGrowth;
const maxV = Math.max(...pts.map(p=>p.cum), 1);
const x = i => pad + i*((W-2*pad)/(pts.length-1||1));
const y = v => H-pad - (v/maxV)*(H-2*pad);
let path = pts.map((p,i)=> (i?"L":"M")+x(i)+" "+y(p.cum)).join(" ");
let dots = pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.cum)}" r="4" fill="#4f9dff"/>
  <text x="${x(i)}" y="${y(p.cum)-10}" fill="#e6ecff" font-size="12" text-anchor="middle">${p.cum}</text>
  <text x="${x(i)}" y="${H-pad+18}" fill="#9fb0d8" font-size="11" text-anchor="middle">${p.date.slice(5)}</text>`).join("");
svg.innerHTML = `<path d="${path}" fill="none" stroke="#4f9dff" stroke-width="2"/>
  <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#2e3a5e"/>
  <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${H-pad}" stroke="#2e3a5e"/>${dots}`;

document.querySelector("#metrics tbody").innerHTML = DATA.metrics.map(m=>
  `<tr><td>${m.name}</td><td><span class="pill">${m.value}</span></td><td>${m.desc}</td></tr>`).join("");
</script>
</body>
</html>
