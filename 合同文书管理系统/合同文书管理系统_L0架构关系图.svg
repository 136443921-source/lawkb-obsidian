<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif">
  <defs>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1000" height="920" fill="#ffffff"/>
  <rect x="8" y="8" width="984" height="904" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="10"/>

  <!-- 标题 -->
  <text x="500" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">小强律师数字分身系统 · 合同文书管理系统 L0 架构与子系统联动图</text>

  <!-- 根节点 -->
  <rect x="250" y="56" width="500" height="56" rx="8" fill="#1f2937"/>
  <text x="500" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">小强律师数字分身系统</text>
  <text x="500" y="100" text-anchor="middle" font-size="11" fill="#cbd5e1">数字分身 3.0 · 小强律师 AI 助手（legal-base 人格基底）</text>

  <!-- 根 → L0 / CMS 连线 -->
  <line x1="420" y1="112" x2="330" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="580" y1="112" x2="790" y2="163" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- L0 合同文书管理系统 -->
  <rect x="60" y="165" width="540" height="315" rx="10" fill="#eff6ff" stroke="#1e40af" stroke-width="2.5"/>
  <rect x="60" y="165" width="540" height="34" rx="10" fill="#1e40af"/>
  <text x="330" y="187" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">合同文书管理系统（水平层 L0 · 路由中枢 + 联动配置中心）</text>

  <!-- 子模块 A -->
  <rect x="80" y="210" width="500" height="72" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="92" y="232" font-size="12.5" font-weight="bold" fill="#1e3a8a">A 合同审查（owned 自有）</text>
  <text x="92" y="252" font-size="10.5" fill="#1e293b">编排：合同审查工作流（蓝队律师合同审查 → 红队合同审查律师 → 合同审查门禁）</text>
  <text x="92" y="270" font-size="10.5" fill="#475569">承载：通用商事合同（股权/租赁/服务/买卖等非慈善医院行业合同）</text>

  <!-- 子模块 B -->
  <rect x="80" y="292" width="500" height="72" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="92" y="314" font-size="12.5" font-weight="bold" fill="#1e3a8a">B 非诉文书起草审查（owned 自有）</text>
  <text x="92" y="334" font-size="10.5" fill="#1e293b">编排：非诉文书红蓝复核工作流 + 法律文书写作助手（统一）+ 文书审查(非合同类,统一)</text>
  <text x="92" y="352" font-size="10.5" fill="#475569">范围：合同审查意见 / 法律备忘录 / 律师函 / 尽调报告 / 制度文本</text>

  <!-- 子模块 C -->
  <rect x="80" y="374" width="500" height="72" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="92" y="396" font-size="12.5" font-weight="bold" fill="#92400e">C 诉讼文书（route-out only 仅路由出）</text>
  <text x="92" y="416" font-size="10.5" fill="#1e293b">仅路由出 → 诉讼文书红蓝复核工作流（蓝队/红队出庭律师 + 文书审查非合同类[诉]）</text>
  <text x="92" y="434" font-size="10.5" fill="#475569">红线约束：不持有所有权，法律问题优先小强系统</text>

  <text x="330" y="470" text-anchor="middle" font-size="9.5" fill="#64748b">注：法律文书写作助手 / 文书审查(非合同类) 为诉+非诉统一技能，被 B、C 跨域共用，不拆分</text>

  <!-- 小德 CMS 垂直层 -->
  <rect x="640" y="165" width="300" height="170" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="640" y="165" width="300" height="34" rx="10" fill="#0f766e"/>
  <text x="790" y="187" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">小德合规管理系统（垂直层 CMS）</text>

  <rect x="660" y="212" width="260" height="46" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="672" y="233" font-size="11.5" font-weight="bold" fill="#134e4a">子模板A · 慈善合规</text>
  <text x="672" y="250" font-size="10" fill="#134e4a">小德慈善合规中枢</text>

  <rect x="660" y="266" width="260" height="46" rx="6" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.4"/>
  <text x="672" y="287" font-size="11.5" font-weight="bold" fill="#134e4a">子模板B · 医院合规与纠纷</text>
  <text x="672" y="304" font-size="10" fill="#134e4a">医院合规与纠纷处理</text>

  <!-- G8 路由箭头（CMS → L0） -->
  <path d="M790,312 C720,360 660,300 600,256" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7,4" marker-end="url(#arrowRed)"/>
  <rect x="648" y="338" width="118" height="20" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="707" y="352" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">G8 本行业合同路由</text>

  <!-- L0 → 联动配置中心 -->
  <line x1="330" y1="480" x2="360" y2="503" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- 联动配置中心 -->
  <rect x="120" y="505" width="480" height="62" rx="9" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="528" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#581c87">联动配置中心（L0 集中声明 6 条）</text>
  <text x="360" y="548" text-anchor="middle" font-size="10" fill="#6b21a8">①G8·小德CMS　②知识飞轮　③案件全生命周期　④模拟法庭　⑤元典MCP　⑥LTI</text>

  <!-- 联动中心 → 外部子系统 -->
  <line x1="200" y1="567" x2="145" y2="600" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowViolet)"/>
  <line x1="280" y1="567" x2="335" y2="600" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowViolet)"/>
  <line x1="360" y1="567" x2="525" y2="600" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowViolet)"/>
  <line x1="440" y1="567" x2="715" y2="600" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowViolet)"/>
  <line x1="500" y1="567" x2="905" y2="600" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arrowViolet)"/>

  <!-- 外部子系统 row -->
  <g font-size="10.5">
    <rect x="60" y="600" width="170" height="78" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="145" y="624" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">知识飞轮</text>
    <text x="145" y="644" text-anchor="middle" font-size="9.5" fill="#475569">调用记录 / 协同埋点</text>
    <text x="145" y="660" text-anchor="middle" font-size="9.5" fill="#475569">场景化推送</text>

    <rect x="250" y="600" width="170" height="78" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="335" y="624" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">案件全生命周期</text>
    <text x="335" y="644" text-anchor="middle" font-size="9.5" fill="#475569">文书归入对应案件</text>
    <text x="335" y="660" text-anchor="middle" font-size="9.5" fill="#475569">案卷归档联动</text>

    <rect x="440" y="600" width="170" height="78" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="525" y="624" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">模拟法庭</text>
    <text x="525" y="644" text-anchor="middle" font-size="9.5" fill="#475569">庭审准备联动</text>
    <text x="525" y="660" text-anchor="middle" font-size="9.5" fill="#475569">攻防推演调用</text>

    <rect x="630" y="600" width="170" height="78" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="715" y="624" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">元典 MCP</text>
    <text x="715" y="644" text-anchor="middle" font-size="9.5" fill="#475569">法条 / 主体核验</text>
    <text x="715" y="660" text-anchor="middle" font-size="9.5" fill="#475569">类案检索支撑</text>

    <rect x="820" y="600" width="170" height="78" rx="7" fill="#f1f5f9" stroke="#475569" stroke-width="1.4"/>
    <text x="905" y="624" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e293b">LTI 文本监控器</text>
    <text x="905" y="644" text-anchor="middle" font-size="9.5" fill="#475569">强制门禁拦截</text>
    <text x="905" y="660" text-anchor="middle" font-size="9.5" fill="#475569">REJECT 禁输出</text>
  </g>

  <!-- 红线铁律框 -->
  <rect x="60" y="708" width="930" height="74" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  <rect x="74" y="722" width="14" height="14" rx="3" fill="#dc2626"/>
  <text x="98" y="734" font-size="12" font-weight="bold" fill="#991b1b">红线铁律（法律问题优先小强系统）</text>
  <text x="98" y="756" font-size="10.5" fill="#7f1d1d">涉诉 / 涉裁 / 涉刑 / 合同违约 / 医疗纠纷诉讼 → 强制路由出；合同文书管理系统（L0）不持有诉讼 / 仲裁文书所有权</text>
  <text x="98" y="772" font-size="10.5" fill="#7f1d1d">Vertical(小德CMS) × Horizontal(合同文书管理系统 L0) + G8 交叉调用，不层级并入</text>

  <!-- 图例 -->
  <g font-size="10" fill="#475569">
    <rect x="60" y="804" width="14" height="14" rx="3" fill="#1e40af"/>
    <text x="80" y="815">水平层 L0（合同文书管理系统）</text>
    <rect x="280" y="804" width="14" height="14" rx="3" fill="#0f766e"/>
    <text x="300" y="815">垂直层 CMS（小德合规）</text>
    <rect x="500" y="804" width="14" height="14" rx="3" fill="#7c3aed"/>
    <text x="520" y="815">联动配置</text>
    <line x1="640" y1="811" x2="664" y2="811" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="7,4"/>
    <text x="670" y="815">G8 行业合同路由（红线）</text>
