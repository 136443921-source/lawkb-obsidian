  <text x="500" y="860" text-anchor="middle" font-size="9" fill="#94a3b8">生成：2026-08-28 · 对应 skill：合同文书管理系统 / 小德合规管理系统 / 合同审查工作流 / 非诉·诉讼文书红蓝复核工作流</text>
