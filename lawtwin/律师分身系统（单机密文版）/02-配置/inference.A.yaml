# =============================================================================
# 律师分身·单机密文版 —— 形态 A 推理配置样本
# 适用：个人律师 / 5–20 人小所，客户自有 API + 本机 Ollama 兜底
# 来源：M1 推理核心 ~/lawtwin-open/core/examples/inference.A.yaml（已实地核实）
# 用法：复制为 02-配置/inference.yaml 后按客户环境修改，再跑
#         python3 -m lawtwin_inference.cli validate --config inference.yaml
#
# ⚠️ 安全红线（违反将拒绝启动，不是警告）：
#   1. 禁止写 api_key / secret / token 等明文字段 —— 只能用 api_key_env 引用环境变量
#   2. 密钥永不写入本文件、永不进 git
# =============================================================================

# ---------- 主后端（必填）----------
provider: openai_compatible      # Ollama / vLLM / DeepSeek / 通义 均走此协议
base_url: "https://api.deepseek.com/v1"
api_key_env: LAWTWIN_API_KEY     # 只写环境变量名，值从环境读，不落盘
model: "deepseek-chat"

# ---------- 降级后端（可选）----------
# 主后端不可用时自动切换；命中即标记 degraded=true，LTI 门禁收紧阈值
fallback:
  enabled: true
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen2.5:14b-instruct-q4_K_M"
  note: "本地 Ollama 降级模式，LTI 门禁自动收紧阈值"

# ---------- 网络策略（对应部署形态）----------
network:
  # allow_external = A 形态（可外联客户自有 API）
  mode: allow_external

# ---------- 调用参数 ----------
timeout_seconds: 60
max_retries: 2                   # 仅对超时/限流/连接错误退避重试

# ---------- 审计 ----------
audit_log_path: "./logs/inference-audit.jsonl"
audit_include_content: false     # true=连 prompt/响应正文一起落盘（涉密形态必须 false）

# ---------- 降级时给 LTI 的标记 ----------
degraded_profile: lti_strict
